<style>
:root{--night:#14102b;--amber:#ffc766;--rose:#e86a8a;--paper:#f6ecd9;--ink:#2a2140;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

canvas{display:block;touch-action:none}

@keyframes fadeout{0%,80%{opacity:1}100%{opacity:0}}
#cin{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);display:none;gap:6px;z-index:7;width:min(560px,92vw)}
#cin input{flex:1;margin:0;padding:.55rem .9rem;border-radius:999px;border:1px solid rgba(246,236,217,.35);background:rgba(20,16,43,.9);color:var(--paper)}
#emo{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);display:none;flex-direction:column;gap:6px;z-index:7}
#rot{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#14102b;text-align:center;padding:24px}
@media (orientation:portrait) and (pointer:coarse){body:not(.norot) #rot{display:flex}}
.ph{width:54px;height:90px;border:4px solid var(--amber);border-radius:12px;animation:tilt 2.4s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (pointer:coarse){#hud .btn{padding:.35rem .75rem;font-size:.8rem}#hud .t{font-size:1.25rem}}
@media (max-height:520px){#start{overflow:auto;align-items:flex-start}.card h1{font-size:2.1rem}.card p{margin-bottom:.7rem}#vimg{max-height:46vh}}

.btn.ghost{background:rgba(20,16,43,.7);color:var(--paper);border:1px solid rgba(246,236,217,.35)}

#prompt{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:50%;transform:translateX(-50%);z-index:5;display:none;max-width:90vw}

#vcap{font-family:Caveat,cursive;font-size:1.8rem}
.row{display:flex;gap:8px;justify-content:center}

#start{background:rgba(20,16,43,.55);backdrop-filter:blur(6px)}

</style></head><body>
<div id="hud"><span class="t" id="title">Hado Afaqu Memories</span>
<span id="net"></span><button class="btn ghost" id="chatb">Chat</button><button class="btn ghost" id="emob">Emotes</button><button class="btn ghost" id="swap">Switch partner</button>
<button class="btn ghost" id="newroom">Add a date</button><button class="btn ghost" id="edate">Edit date</button><button class="btn" id="add">Add photos</button>

<div id="edit"><div class="card"><h1>Edit date</h1><input id="ed" maxlength="18" placeholder="e.g. 18 Oct 2025"><div class="row"><button class="btn ghost" id="ecancel">Cancel</button><button class="btn" id="esave">Save</button></div></div></div>

<div id="rot"><div class="ph"></div><p>Turn your phone sideways for the best view</p><button class="btn ghost" id="rotx">Continue anyway</button></div>
<div id="clog"></div>
<div id="cin"><input id="ci" maxlength="120" placeholder="Say something (chat is never saved)" autocomplete="off"><button class="btn" id="cs">Send</button><button class="btn ghost" id="cx">Clear</button></div>
<div id="emo"><button class="btn ghost" data-e="dance">💃 Dance (1)</button><button class="btn ghost" data-e="wave">👋 Wave (2)</button><button class="btn ghost" data-e="heart">💖 Heart (3)</button><button class="btn ghost" data-e="hug">🤗 Hug (4)</button></div>
<div id="fade"></div>

<script>
const $=s=>document.querySelector(s);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x14102b);scene.fog=new THREE.Fog(0x14102b,35,120);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1.5:2));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function glowTex(draw){const c=mk(64,64),x=c.getContext('2d');draw(x);return new THREE.CanvasTexture(c)}
const glow=glowTex(x=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.3,'rgba(255,220,150,.8)');g.addColorStop(1,'rgba(255,200,100,0)');x.fillStyle=g;x.fillRect(0,0,64,64)});
const heartT=glowTex(x=>{x.font='52px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#ff7fa3';x.fillText('♥',32,34)});

// sky
{const p=[];for(let i=0;i<500;i++)p.push((Math.random()-.5)*160,12+Math.random()*50,-Math.random()*140+30);
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
window.starM=new THREE.PointsMaterial({color:0xffffff,size:.5,fog:false});scene.add(new THREE.Points(g,starM));
const moon=new THREE.Mesh(new THREE.SphereGeometry(3,24,24),new THREE.MeshBasicMaterial({color:0xfff3c4,fog:false}));moon.position.set(-28,30,-50);scene.add(moon);const mh=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color:0xfff0c0,fog:false,transparent:true,opacity:.6,blending:THREE.AdditiveBlending}));mh.scale.set(22,22,1);mh.position.copy(moon.position);scene.add(mh)}

// characters
function person(shirt,hair,dress){const g=new THREE.Group(),M=c=>new THREE.MeshLambertMaterial({color:c}),SK=0xf1c9a5;
const up=new THREE.Group();up.position.y=.65;g.add(up);g.up=up;
const body=new THREE.Mesh(dress?new THREE.ConeGeometry(.62,1,18):new THREE.CylinderGeometry(.38,.45,1.1,16),M(shirt));body.position.y=(dress?.8:1.05)-.65;up.add(body);
if(dress){const tr=new THREE.Mesh(new THREE.CylinderGeometry(.27,.3,.7,16),M(shirt));tr.position.y=1.45-.65;up.add(tr)}
const nk=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.14,8),M(SK));nk.position.y=1.72-.65;up.add(nk);
const head=new THREE.Mesh(new THREE.SphereGeometry(.36,20,20),M(SK));head.position.y=1.95-.65;up.add(head);
if(dress){const fr=new THREE.MeshBasicMaterial({color:0x3a2a22}),ln=new THREE.MeshBasicMaterial({color:0xcfe8ff,transparent:true,opacity:.22});[-1,1].forEach(s=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.105,.016,8,22),fr);r.position.set(s*.15,.03,.345);head.add(r);const l=new THREE.Mesh(new THREE.CircleGeometry(.1,18),ln);l.position.set(s*.15,.03,.345);head.add(l);const t=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,.34,6),fr);t.rotation.x=Math.PI/2;t.position.set(s*.255,.03,.17);head.add(t)});const br=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,.07,6),fr);br.rotation.z=Math.PI/2;br.position.set(0,.05,.35);head.add(br)}
const hr=new THREE.Mesh(new THREE.SphereGeometry(.39,20,20),M(hair));hr.scale.y=.8;hr.position.set(0,.11,-.05);head.add(hr);
if(dress){const t=new THREE.Mesh(new THREE.SphereGeometry(.2,12,12),M(hair));t.position.set(0,-.1,-.42);head.add(t);g.tail=t}
g.eyes=[-.12,.12].map(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.04,8,8),M(0x222222));e.position.set(x,.02,.33);head.add(e);return e});
const mo=new THREE.Mesh(new THREE.TorusGeometry(.06,.012,6,12,Math.PI),M(0xc0504d));mo.rotation.z=Math.PI;mo.position.set(0,-.1,.345);head.add(mo);
g.legs=[-.17,.17].map(x=>{const l=new THREE.Group();l.position.set(x,.65,0);g.add(l);const lc=dress?SK:0x2b2f4a;
const th=new THREE.Mesh(new THREE.CylinderGeometry(.095,.085,.32,10),M(lc));th.position.y=-.16;l.add(th);
const kn=new THREE.Group();kn.position.y=-.32;l.add(kn);const sh=new THREE.Mesh(new THREE.CylinderGeometry(.08,.065,.3,10),M(lc));sh.position.y=-.15;kn.add(sh);
const ft=new THREE.Mesh(new THREE.BoxGeometry(.15,.07,.27),M(0x22222a));ft.position.set(0,-.31,.06);kn.add(ft);l.knee=kn;return l});
g.arms=[-1,1].map(s=>{const a=new THREE.Group();a.position.set(s*(dress?.36:.47),(dress?1.7:1.55)-.65,0);up.add(a);
const ua=new THREE.Mesh(new THREE.CylinderGeometry(.075,.07,.33,10),M(shirt));ua.position.y=-.165;a.add(ua);
const fo=new THREE.Group();fo.position.y=-.33;a.add(fo);const fa=new THREE.Mesh(new THREE.CylinderGeometry(.065,.055,.3,10),M(dress?SK:shirt));fa.position.y=-.15;fo.add(fa);
const hd=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),M(SK));hd.position.y=-.32;fo.add(hd);a.fore=fo;return a});
g.head=head;g.body=body;g.ph=0;g.mv=0;g._nb=2+Math.random()*3;g._bk=-9;return g}
function label(t){const c=mk(256,64),x=c.getContext('2d');x.font='700 44px Caveat,cursive';x.textAlign='center';x.fillStyle='#f6ecd9';x.shadowColor='#000';x.shadowBlur=8;x.fillText(t,128,46);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,fog:false}));s.scale.set(2.4,.6,1);s.position.y=2.9;return s}
const him=person(0x4a76c9,0x3a2a22,false),her=person(0xe86a8a,0x6b3a2a,true);
him.position.set(-1,0,44);her.position.set(1,0,45.2);scene.add(him,her);
const P=[him,her];let act=0;
let n1='Hado',n2='Afaqu';

// memories
const hues=[340,28,200,270,150,50];let mem=[],view=-1;
function newMem(a){const m={ph:true,src:null,cap:'Our memory',date:'',cv:mk(800,600)};m.i=a.length;m.h=a.h||0;drawPh(m);m.tex=new THREE.CanvasTexture(m.cv);return m}
function drawPh(m){const x=m.cv.getContext('2d'),h=hues[(m.i+m.h)%6],g=x.createLinearGradient(0,0,800,600);g.addColorStop(0,`hsl(${h},60%,55%)`);g.addColorStop(1,`hsl(${(h+50)%360},55%,26%)`);x.fillStyle=g;x.fillRect(0,0,800,600);
x.fillStyle='rgba(255,255,255,.85)';x.textAlign='center';x.font='160px sans-serif';x.fillText('♥',400,330);x.font='34px Figtree,sans-serif';x.fillText('Your memory goes here',400,420)}
function load(m){const im=new Image();im.onload=()=>{const x=m.cv.getContext('2d'),s=Math.max(800/im.width,600/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(800-w)/2,(600-h)/2,w,h);m.tex.needsUpdate=true};im.src=m.src}
const rooms=[];for(let k=0;k<6;k++){const a=[];a.h=k;for(let i=0;i<4;i++)a.push(newMem(a));rooms.push({d:k==0?'18 Oct 2025':'Add a date',mem:a})}

// street, gate and library front
const out=new THREE.Group();scene.add(out);const fm=[];
const chk=(()=>{const c=mk(64,64),x=c.getContext('2d');x.fillStyle='#b8ad9b';x.fillRect(0,0,64,64);x.fillStyle='#2f2540';x.fillRect(0,0,32,32);x.fillRect(32,32,32,32);return c})();
const bk=(()=>{const c=mk(128,256),x=c.getContext('2d');x.fillStyle='#2a1a14';x.fillRect(0,0,128,256);const cs=['#8a2f4d','#2f5a7a','#c9973f','#3f6b4a','#6b3f7a','#b5532f','#d8cdb8'];for(let r=0;r<5;r++){let px=3;while(px<122){const w=5+Math.random()*7|0,h=30+Math.random()*14|0;x.fillStyle=cs[Math.random()*7|0];x.fillRect(px,r*51+46-h,w,h);px+=w+1}x.fillStyle='#5a3b26';x.fillRect(0,r*51+46,128,5)}return new THREE.CanvasTexture(c)})();
const FM=c=>{const m=new THREE.MeshLambertMaterial({color:c,transparent:true});fm.push(m);return m};
const bx=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);out.add(o);return o};
const pl=(w,h,c,x,y,z)=>{const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshLambertMaterial({color:c}));o.rotation.x=-Math.PI/2;o.position.set(x,y,z);out.add(o)};
pl(160,170,0x15132a,0,-.02,20);pl(14,82,0x4d4560,0,.01,51);pl(14,8,0x6b6180,0,.02,14);
function signTex(t,sub,w,h){const c=mk(w,h),x=c.getContext('2d');x.fillStyle='#1b1230';x.fillRect(0,0,w,h);x.strokeStyle='#c9973f';x.lineWidth=h*.04;x.strokeRect(h*.06,h*.06,w-h*.12,h-h*.12);x.textAlign='center';x.fillStyle='#ffc766';x.shadowColor='#ffc766';x.shadowBlur=h*.1;x.font='700 '+h*.5+'px Caveat,cursive';x.fillText(t,w/2,h*.58);x.shadowBlur=0;x.fillStyle='#f6ecd9';x.font=h*.15+'px Figtree,sans-serif';x.fillText(sub,w/2,h*.84);return new THREE.CanvasTexture(c)}
const signs=[];function mkSign(x,y,z,w,h,t,sub,pw,ph,fade){const m=new THREE.MeshBasicMaterial({transparent:true});if(fade)fm.push(m);const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);o.position.set(x,y,z);out.add(o);signs.push(()=>{m.map=signTex(t,sub,pw,ph);m.needsUpdate=true});return o}
const stone=FM(0xb9ac93),stone2=FM(0xd2c7b0);
bx(5.6,9,.6,stone,-4.6,4.5,10);bx(5.6,9,.6,stone,4.6,4.5,10);bx(3.6,4.5,.6,stone,0,6.75,10);bx(15.4,.7,3,stone,0,8.75,11);bx(7,.25,1.6,stone2,0,.12,11.9);
[-6.2,-3.4,3.4,6.2].forEach(x=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,8.4,16),stone2);c.position.set(x,4.2,11.3);out.add(c)});
const pd=new THREE.Mesh(new THREE.CylinderGeometry(8.4,8.4,3,3),stone);pd.rotation.x=-Math.PI/2;pd.scale.z=.27;pd.position.set(0,10.23,11);out.add(pd);
mkSign(0,6.9,10.35,8,1.8,'Hado Afaqu Memories','Library of us',1024,230,true);
function leaf(px,pz,w,h,m,e){const g=new THREE.Group();g.position.set(px,0,pz);const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);o.position.set(e*w/2,h/2,0);g.add(o);out.add(g);return g}
const doorM=FM(0x5a3520);doorM.side=THREE.DoubleSide;
const doorL=leaf(-1.8,10.25,1.8,4.5,doorM,1),doorR=leaf(1.8,10.25,1.8,4.5,doorM,-1);
const barT=(()=>{const c=mk(256,256),x=c.getContext('2d');for(let i=0;i<8;i++){x.fillStyle='#241c3a';x.fillRect(i*32+12,30,8,226);x.fillStyle='#d9a94a';x.beginPath();x.moveTo(i*32+10,30);x.lineTo(i*32+16,4);x.lineTo(i*32+22,30);x.fill()}x.fillStyle='#241c3a';x.fillRect(0,90,256,10);x.fillRect(0,200,256,10);return new THREE.CanvasTexture(c)})();
const gateM=new THREE.MeshLambertMaterial({map:barT,transparent:true,alphaTest:.5,side:THREE.DoubleSide});

function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=mk(im.width*k|0,im.height*k|0);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||f),'image/jpeg',.85)};im.onerror=()=>res(f);im.src=u})}
const DB=new Promise(r=>{try{const q=indexedDB.open('hado-afaqu-memories',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const kv=async(m,k,v)=>{const d=await DB;if(!d)return;return new Promise(r=>{const t=d.transaction('kv',m==='get'?'readonly':'readwrite'),st=t.objectStore('kv'),q=m==='get'?st.get(k):st.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
let svT=0;function save(){clearTimeout(svT);svT=setTimeout(()=>kv('put','state',rooms.map(r=>({d:r.d,mem:r.mem.map(m=>({b:m.blob||null,cap:m.cap,date:m.date}))}))),400)}
function applySaved(st){rooms.length=0;st.forEach((r,k)=>{const a=[];a.h=k;r.mem.forEach(x=>{const m=newMem(a);m.cap=x.cap;m.date=x.date;if(x.b){m.ph=false;m.blob=x.b;m.src=URL.createObjectURL(x.b);load(m)}a.push(m)});rooms.push({d:r.d,mem:a})})}
kv('get','state').then(st=>{if(st&&st.length){applySaved(st);build()}});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
$('#wn').textContent=window.USER==='hado'?'Hado':'Afaqu';
const lo=()=>fetch('/api/logout',{method:'POST'}).finally(()=>location.href='/');$('#lo').onclick=lo;$('#lo2').onclick=lo;
$('#bk').onclick=async()=>{const rd=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)}),o2=[];for(const r of rooms){const ms=[];for(const m of r.mem)ms.push({b:m.blob?await rd(m.blob):null,cap:m.cap,date:m.date});o2.push({d:r.d,mem:ms})}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o2)],{type:'application/json'}));a.download='hado-afaqu-backup.json';a.click()};
$('#rs').onclick=()=>$('#rsf').click();
$('#rsf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const st=JSON.parse(await f.text());for(const r of st)for(const m of r.mem)if(m.b)m.b=await(await fetch(m.b)).blob();await kv('put','state',st);location.reload()};
function FS(){const d=document,e=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}const f=e.requestFullscreen||e.webkitRequestFullscreen;if(!f)return;Promise.resolve(f.call(e)).then(()=>{if(matchMedia('(pointer:coarse)').matches&&screen.orientation&&screen.orientation.lock)return screen.orientation.lock('landscape')}).catch(()=>{})}
$('#fs').onclick=FS;$('#rotx').onclick=()=>document.body.classList.add('norot');
