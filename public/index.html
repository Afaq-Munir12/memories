<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14102b"><title>Hado Afaqu Memories</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--amber:#ffc766;--rose:#e86a8a;--paper:#f6ecd9;--ink:#2a2140}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:16px;font-family:Figtree,system-ui,sans-serif;color:var(--paper);background:radial-gradient(ellipse at 50% 0%,#3a2a6e,#14102b 62%);overflow:hidden}
.h{position:fixed;bottom:-40px;color:var(--rose);opacity:.5;animation:up linear infinite}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
form{position:relative;width:100%;max-width:380px;text-align:center;padding:2rem 1.5rem;border-radius:20px;background:rgba(20,16,43,.72);border:1px solid rgba(255,199,102,.35);backdrop-filter:blur(8px);animation:rise .9s both}
form.shake{animation:shake .4s}
h1{font-family:Caveat,cursive;font-size:3rem;margin:0 0 .2rem;text-shadow:0 0 26px rgba(255,199,102,.55)}
p{margin:0 0 1.2rem;opacity:.8}
input,button{font:inherit;width:100%;margin-bottom:.7rem;padding:.8rem 1rem;border-radius:12px}
input{border:1px solid rgba(246,236,217,.3);background:rgba(246,236,217,.08);color:var(--paper)}
button{border:0;background:var(--amber);color:var(--ink);font-weight:600;cursor:pointer;border-radius:999px}
button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
#err{min-height:1.3em;color:#ff8fa8;font-size:.9rem;margin-bottom:.4rem}
</style></head><body>
<form id="f" autocomplete="on"><h1>Hado Afaqu Memories</h1><p>Our private library. Please sign in.</p>
<input id="u" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" required>
<input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
<div id="err" role="alert"></div><button id="b">Enter the library</button></form>
<script>
for(let i=0;i<14;i++){const h=document.createElement('span');h.className='h';h.textContent='\u2665';h.style.left=Math.random()*100+'vw';h.style.fontSize=10+Math.random()*22+'px';h.style.animationDuration=8+Math.random()*10+'s';h.style.animationDelay=-Math.random()*12+'s';document.body.prepend(h)}
const f=document.getElementById('f'),err=document.getElementById('err'),b=document.getElementById('b');
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;err.textContent='';
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u.value,pass:p.value})});const j=await r.json();
  if(r.ok){location.href='/app';return}
  err.textContent=j.error||'Something went wrong.'}catch(x){err.textContent='Could not reach the server.'}
 f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');b.disabled=false};
</script></body></html>
